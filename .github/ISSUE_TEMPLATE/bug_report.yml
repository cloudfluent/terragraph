name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal blueprint.hcl to reproduce
      description: The smallest blueprint that reproduces this, plus the exact command you ran.
      render: hcl
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected vs. actual behavior
    validations:
      required: true

  - type: input
    id: terragraph-version
    attributes:
      label: terragraph version
      description: Output of `terragraph --version`
      placeholder: "terragraph version 0.1.0"
    validations:
      required: true

  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      description: Which binary terragraph shelled out to. Pick "Both" only if you reproduced it on each.
      options:
        - Terraform
        - OpenTofu
        - Both
    validations:
      required: true

  - type: input
    id: tf-version
    attributes:
      label: terraform/tofu version
      placeholder: "Terraform v1.9.0 / OpenTofu v1.8.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      description: Pick every one you actually reproduced this on. Choose WSL on its own rather than also picking Linux or Windows, unless you confirmed those separately.
      multiple: true
      options:
        - macOS
        - Linux
        - Windows
        - WSL
        - Other
    validations:
      required: true

  - type: input
    id: os-detail
    attributes:
      label: OS version and architecture
      placeholder: "macOS 15.2 arm64, Ubuntu 24.04 amd64, ..."
    validations:
      required: false
