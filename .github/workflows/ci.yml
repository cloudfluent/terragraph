name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Superseded commits must not keep occupying runners needed by the latest PR or main revision.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: fmt, lint, docs, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
          cache: true

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      # Runs the exact same Go and VS Code extension checks a contributor runs locally via `make check`, so CI never drifts from the local dev loop.
      - run: xvfb-run -a make check

  cross-platform:
    name: build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
          cache: true

      # Not `make check`: fmt/lint/docs-check are OS-independent and already covered by the check job above on ubuntu-latest. This job exists only to catch OS-specific build/runtime bugs (path separators, process spawning) that cross-compiling for a target from one OS, as the release pipeline does, can't catch.
      - run: go build ./...
      - run: go test ./... -race

  contract-runtimes:
    name: contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        id: setup_go
        with:
          go-version: "1.27.1"
          cache: true

      # One runner per OS shares setup and compilation while every runtime still executes uncached native fixtures.
      - name: Install Terraform 1.5.7
        id: terraform_minimum
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.5.7"
          terraform_wrapper: false
      - name: Contracts (Terraform 1.5.7)
        run: go test -race -count=1 ./internal/engine -run '^TestContracts_Real' -v
        shell: bash
        env:
          TERRAGRAPH_TEST_RUNTIME: terraform

      # A failed runtime must not hide results for the others, but cancellation must stop all remaining work.
      - name: Install Terraform 1.16.0
        id: terraform_current
        if: ${{ !cancelled() && steps.setup_go.outcome == 'success' }}
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.0"
          terraform_wrapper: false
      - name: Contracts (Terraform 1.16.0)
        if: ${{ !cancelled() && steps.terraform_current.outcome == 'success' }}
        run: go test -race -count=1 ./internal/engine -run '^TestContracts_Real' -v
        shell: bash
        env:
          TERRAGRAPH_TEST_RUNTIME: terraform

      - name: Install OpenTofu 1.11.0
        id: opentofu
        if: ${{ !cancelled() && steps.setup_go.outcome == 'success' }}
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: "1.11.0"
          tofu_wrapper: false
      - name: Contracts (OpenTofu 1.11.0)
        if: ${{ !cancelled() && steps.opentofu.outcome == 'success' }}
        run: go test -race -count=1 ./internal/engine -run '^TestContracts_Real' -v
        shell: bash
        env:
          TERRAGRAPH_TEST_RUNTIME: tofu
