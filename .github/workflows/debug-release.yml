name: debug-release
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: try create a published release pointed at a commit sha, matching release-please's exact payload shape
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/releases \
            -d "{\"tag_name\":\"debug-test-tag-3\",\"target_commitish\":\"${{ github.sha }}\",\"name\":\"debug3\",\"body\":\"diagnostic3\",\"draft\":false,\"prerelease\":false}" \
            -w "\nHTTP_STATUS:%{http_code}\n"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
