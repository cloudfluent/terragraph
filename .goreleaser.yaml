# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# Builds and attaches binaries to the release release-please already created for the tag (see .github/workflows/release-please.yml; .github/workflows/release.yml runs this same pipeline for a manually-pushed tag too). Validate locally with `goreleaser check`, or build without publishing via `goreleaser release --snapshot --clean`.
version: 2

project_name: terragraph

builds:
  - id: terragraph
    main: ./cmd/terragraph
    binary: terragraph
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: terragraph
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # Matches the OS/arch spelling `uname -s`/`uname -m` report, so an install script can build the
    # download name straight from `uname` output without a lookup table.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}

# release-please owns the changelog (release-please-config.json's changelog-sections) and writes it as the release body before this pipeline ever runs; generating one here too would just be discarded (see release.mode below) or, worse, fail the whole release over an unrelated changelog error.
changelog:
  disable: true

release:
  # keep-existing is already GoReleaser's default: an existing release's body (release-please's changelog, in the normal flow) is left untouched, only missing artifacts get uploaded. Spelled out here so the intent doesn't depend on knowing that default.
  mode: keep-existing
  github:
    owner: cloudfluent
    name: terragraph
