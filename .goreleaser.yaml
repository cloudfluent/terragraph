# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# Builds and attaches binaries to the release release-please already created for the tag (see .github/workflows/release-please.yml; .github/workflows/release.yml runs this same pipeline for a manually-pushed tag too). Validate locally with `goreleaser check`, or build without publishing via `goreleaser release --snapshot --clean`.
version: 2

project_name: terragraph

builds:
  - id: terragraph
    main: ./cmd/terragraph
    binary: terragraph
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

  # Split out from the build above because only this one needs the quill post-hook. A binary cross-compiled for darwin/arm64 on the Linux runner has no code signature at all, and the kernel SIGKILLs anything unsigned on Apple Silicon before it can even run. quill ad-hoc-signs it (no Apple Developer account needed) purely to satisfy that kernel check. That alone isn't enough for the brew cask though: brew cask marks the downloaded binary com.apple.quarantine, and under quarantine even an ad-hoc signature gets Gatekeeper-rejected the same way, so the homebrew_casks preflight below also has to strip that attribute before the binary is ever executed. Without a real Apple Developer ID signature and notarization, a direct (non-brew) download of this binary is still Gatekeeper's problem to solve manually. The CI workflows install quill via `go install` before this runs.
  - id: terragraph-darwin
    main: ./cmd/terragraph
    binary: terragraph
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}
    hooks:
      post:
        - cmd: quill sign --ad-hoc "{{ .Path }}"

archives:
  - id: terragraph
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # Matches the OS/arch spelling `uname -s`/`uname -m` report, so an install script can build the download name straight from `uname` output without a lookup table.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}

# brews (Formula-based) is deprecated by GoReleaser in favor of homebrew_casks; see https://goreleaser.com/deprecations/#brews.
homebrew_casks:
  - name: terragraph
    directory: Casks
    repository:
      owner: cloudfluent
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/cloudfluent/terragraph"
    description: "Graph-based orchestration for independent Terraform/OpenTofu root modules"
    license: "Apache-2.0"
    binaries:
      - terragraph
    # The binary is only ad-hoc signed (see the terragraph-darwin build above), which Gatekeeper treats as untrusted once brew's own download marks it com.apple.quarantine. Stripping the attribute here is what other quill-signed goreleaser casks do for this exact failure, see https://github.com/goreleaser/goreleaser/issues/6633. This has to be a preflight, not a postflight: Homebrew's own cask installer (Library/Homebrew/cask/artifact/abstract_artifact.rb's sort_order) always runs GeneratedCompletion, and Binary before it, ahead of any PostflightBlock regardless of stanza order in this file, so a postflight strip would run only after completion generation had already tried (and failed) to execute the still-quarantined binary. PreflightBlock sorts ahead of both, which is confirmed working locally against a real (non-file://) download.
    hooks:
      pre:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", staged_path.to_s]
          end
    generate_completions_from_executable:
      executable: terragraph
      shell_parameter_format: cobra

# release-please owns the changelog (release-please-config.json's changelog-sections) and writes it as the release body before this pipeline ever runs; generating one here too would just be discarded (see release.mode below) or, worse, fail the whole release over an unrelated changelog error.
changelog:
  disable: true

release:
  # keep-existing is already GoReleaser's default: an existing release's body (release-please's changelog, in the normal flow) is left untouched, only missing artifacts get uploaded. Spelled out here so the intent doesn't depend on knowing that default.
  mode: keep-existing
  github:
    owner: cloudfluent
    name: terragraph
